<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Master Ball</title>

    <!-- CSS BS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <!-- ------------------------------------ -->
    <!-- CSS -->
   
    <!-- ------------------------------------ -->
    <!-- ESTILO DE FUENTE EXTERNA -->

    <!-- ------------------------------------ -->
    <!-- SEO -->
    <link rel="icon" href="img/index/logoFavicon.png" type="image/png">
    <meta name="title" content="The Master Ball">
    <meta name="description" content="Tu destino para explorar el universo Pokémon. Sumérgete en la experiencia de nuestra Pokédex, 
    donde encontrarás una selección inicial para comenzar tu aventura. Desbloquea más criaturas para 
    descubrir, desde los legendarios hasta los clásicos favoritos. The Master Ball es tu puerta de entrada al fascinante mundo de 
    Pokémon. ¡Comienza tu búsqueda ahora y atrapa la emoción en The Master Ball!">
</head>

<body>

    <!-- HEADER -->
    <header class="container-fluid">
        <div
            class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
            <div class="col-md-3 mb-2 mb-md-0">
                <a href="index.html" class="d-inline-flex">
                    <img src="img/index/logoPrincipal.png" alt="logoPrincipal" class="w-100">
                </a>
            </div>

            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
                <li><a href="https://pokeapi.co/" target="_blank" class="nav-link px-2">API usada</a></li>
                <li><a href="https://www.pokemon.com/el" target="_blank" class="nav-link px-2">Pokédex</a></li>
                <li>
                    <p class="col-md-4 mb-0 footerGlobalCopy">&copy; 2024 KDA/Nova</p>
                </li>
            </ul>
        </div>
    </header>

    <!-- ------ -->
    <!-- MAIN -->
    <main class="container-fluid">

        <!-- titulo descriptivo -->
        <p id="tituloDescriptivo">¿Qué deseas hacer?</p>

        <!-- menú con botones -->
        <div id="menuConBotones">
            <button type="button" class="btn" id="btnBusquedaPokemon">Búsqueda Pokémon</button>
            <button type="button" class="btn" id="btnFiltrarPokemones">Filtrar Pokemones</button>
            <button type="button" class="btn" id="btnAnalisisAleatorio">Análisis Aleatorio</button>
        </div>

        <!-- tabla con cartas -->
        <div id="tablaConCartas">
            <div class="container-fluid">

                <!-- ordernar por -->
                <div id="menuOrdenador" class="d-none">
                    <p>Orden de los Pokémones: </p>
                    <div>
                        <button type="button" class="btn" id="btnOrdenarCreciente">Nº Creciente</button>
                        <button type="button" class="btn" id="btnOrdenarDecreciente">Nº Decreciente</button>
                        <button type="button" class="btn" id="btnOrdenarAlfabeticamente">Alfabéticamente</button>
                        <button type="button" class="btn" id="btnOrdenarAlfaInverso">Alf. Inverso</button>
                    </div>
                </div>

                <!-- lista de cartas -->
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3" id="tablaDeCartas">
                </div>

                <!-- boton cargar más -->
                <button type="button" class="btn d-none" id="btnCargarMasCartas">Cargar más</button>
            </div>
        </div>


    </main>
 
    <!-- ------------------------------------ -->
    <!-- SWEET ALERT -->

    <!-- ------------------------------------ -->
    <!-- JS BS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- ------------------------------------ -->
    <!-- JS -->
    <script src="js/index.js"></script>

</body>

</html>
