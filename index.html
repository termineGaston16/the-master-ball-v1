<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Master Ball</title>

    <!-- CSS BS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <!-- ------------------------------------ -->
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ------------------------------------ -->
    <!-- ESTILO DE FUENTE EXTERNA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">


    <!-- ------------------------------------ -->
    <!-- SEO -->
    <link rel="icon" href="img/index/logoFavicon.png" type="image/png">
    <meta name="title" content="The Master Ball">
    <meta name="description" content="Tu destino para explorar el universo Pokémon. Sumérgete en la experiencia de nuestra Pokédex, 
    donde encontrarás una selección inicial para comenzar tu aventura. Desbloquea más criaturas para 
    descubrir, desde los legendarios hasta los clásicos favoritos. The Master Ball es tu puerta de entrada al fascinante mundo de 
    Pokémon. ¡Comienza tu búsqueda ahora y atrapa la emoción en The Master Ball!">
</head>

<body class="bodyIndex outfit-fontOne">

    <!-- HEADER -->
    <header class="container-fluid headerIndex">
        <div
            class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom headerIndexSub">
            <div class="col-md-3 mb-2 mb-md-0 headerIndexContenedorLogo">
                <a href="index.html" class="d-inline-flex headerIndexContenedorLogoLink">
                    <img src="img/index/logoPrincipal.png" alt="logoPrincipal" class="headerIndexContenedorLogoLinkImg">
                </a>
            </div>

            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0 headerIndexContenedorLogoUl">
                <li class="headerIndexContenedorLogoUlLi"><a href="https://pokeapi.co/" target="_blank"
                        class="nav-link px-2 headerIndexContenedorLogoUlLiLink">API usada</a></li>
                <li class="headerIndexContenedorLogoUlLi"><a href="https://www.pokemon.com/el" target="_blank"
                        class="nav-link px-2 headerIndexContenedorLogoUlLiLink">Pokédex</a></li>
                <li class="headerIndexContenedorLogoUlLi">
                    <p class="col-md-4 mb-0 globalCopy">&copy; 2024 KDA/Nova</p>
                </li>
            </ul>
        </div>
    </header>

    <!-- ------ -->
    <!-- MAIN -->
    <main class="container-fluid mainIndex">

        <!-- titulo descriptivo -->
        <p id="tituloDescriptivo" class="mainIndexTitutloDescriptivo">¿Qué deseas hacer?</p>

        <!-- menú con botones -->
        <div id="menuConBotones" class="mainIndexMenuConBotones">
            <button type="button" class="btn btnMenuIndex" id="btnBusquedaPokemon">Búsqueda Pokémon</button>
            <button type="button" class="btn btnMenuIndex" id="btnFiltrarPokemones">Filtrar Pokemones</button>
            <button type="button" class="btn btnMenuIndex" id="btnAnalisisAleatorio">Análisis Aleatorio</button>
        </div>

        <!-- tabla con cartas -->
        <div id="tablaConCartas" class="mainIndexTablaConCartas">
            <div class="container-fluid mainIndexTablaConCartasSub">

                <!-- ordernar por -->
                <div id="menuOrdenador" class="mainIndexTablaConCartasOrdernarPor d-none">
                    <p class="mainIndexTablaConCartasOrdernarPorText">Orden de los Pokémones: </p>
                    <div class="mainIndexTablaConCartasOrdernarPorDiv">
                        <button type="button" class="btn btnOrdernar" id="btnOrdenarCreciente">Nº Creciente</button>
                        <button type="button" class="btn btnOrdernar" id="btnOrdenarDecreciente">Nº Decreciente</button>
                        <button type="button" class="btn btnOrdernar" id="btnOrdenarAlfabeticamente">Alfabéticamente</button>
                        <button type="button" class="btn btnOrdernar" id="btnOrdenarAlfaInverso">Alf. Inverso</button>
                    </div>
                </div>

                <!-- lista de cartas -->
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 mainIndexTablaConCartasListaDeCartas" id="tablaDeCartas">
                </div>

                <!-- boton cargar más -->
                <button type="button" class="btn btnCargarMas d-none" id="btnCargarMasCartas">Cargar más</button>
            </div>
        </div>


    </main>

    <!-- ------------------------------------ -->
    <!-- SWEET ALERT -->

    <!-- ------------------------------------ -->
    <!-- JS BS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- ------------------------------------ -->
    <!-- JS -->
    <script src="js/index.js"></script>

</body>

</html>
